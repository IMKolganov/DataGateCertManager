services:
  openvpn-udp:
    image: imkolganov/datagate-monitor-openvpn:latest
    pull_policy: always
    container_name: openvpn-udp
    restart: unless-stopped
    networks:
      - openvpn_network
    cap_add:
      - NET_ADMIN
    devices:
      - "/dev/net/tun:/dev/net/tun"
    volumes:
      - ./data/openvpn_udp:/openvpn-udp
    ports:
      - "1295:1295/udp"
      - "5009:5009"
    # For bridge networking only: raise UDP socket buffer caps so SO_RCVBUF=4MB in the
    # WSS proxy is not silently clamped (~208KB default). With network_mode: host these
    # sysctls are rejected by Docker — set the same keys on the host instead (sysctl -w).
    # sysctls:
    #   net.core.rmem_max: 16777216
    #   net.core.wmem_max: 16777216
    #   net.core.rmem_default: 1048576
    #   net.core.wmem_default: 1048576
    #   net.ipv4.udp_rmem_min: 262144
    #   net.ipv4.udp_wmem_min: 262144
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      EASY_RSA_PATH: "/openvpn-udp/easy-rsa"
      DATA_DIR: /openvpn-udp
      PORT: "1295"
      API_PORT: 5009
      PROTO: udp
      OpenVpnManagement__Port: "5095"
      OpenVpnManagement__Host: "localhost"
      BACKEND__BASEURL: "http://localhost:5581/"
      WAN_IF: eth0
      VPN_SUBNET: "10.50.28.0"
      VPN_NETMASK: "255.255.255.0"
      # Stable device name — set a unique value per stack on multi-VPN hosts
      TUN_DEV: ovpn-udp
      # UDP WSS datapath: dotnet (default) | rust
      # OPENVPN_WSS_UDP_PROXY: rust


networks:
  openvpn_network:
    driver: bridge

volumes:
  openvpn_data_main_udp:

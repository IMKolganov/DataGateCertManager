# Host nginx snippet for OpenVPN WSS (TLS termination in front of Kestrel).
# Not wired automatically — copy into the server's site config and adjust upstream.
#
# Critical for throughput:
#   - proxy_buffering off / tcp_nodelay on
#   - ssl_buffer_size 16k (not 4k)
#   - proxy_pass to the Docker network IP/name, NOT 127.0.0.1:published-port
#     (127.0.0.1:5009 often goes through userspace docker-proxy)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream openvpn_wss_udp {
    # Prefer: put nginx on the same docker network and use the service name.
    # server openvpn-udp:5009;
    server 172.17.0.X:5009;  # container IP if nginx stays on the host
}

server {
    listen 443 ssl http2;
    server_name vpn.example.com;

    ssl_certificate     /etc/letsencrypt/live/vpn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn.example.com/privkey.pem;
    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_buffer_size     16k;
    ssl_session_cache   shared:SSL:10m;
    ssl_prefer_server_ciphers off;

    location /api/proxy {
        proxy_pass http://openvpn_wss_udp;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_socket_keepalive on;
        tcp_nodelay on;
    }
}
